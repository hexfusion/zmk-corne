parse_config:
  raw_binding_map:
    "&ht_esc_sys 3 ESC":
      tap: Esc
      hold: System
      type: held
    "&td_clr_all":
      tap: CLR ALL
      hold: (2x tap)
      type: held
    "&mm LCLK H":
      tap: H
      hold: L Click
      type: held
    "&mm RCLK J":
      tap: J
      hold: R Click
      type: held
    "&td_slash":
      tap: "/"
      hold: "\\"
      type: held
    "&bootloader": BOOT
    "&sys_reset": RESET
